spring.application.name=evaluator
server.port=8082
server.ssl.enabled=false

management.endpoints.web.exposure.include=health,metrics
management.metrics.enable.hikari=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

logging.level.org.springframework.web=DEBUG
logging.level.net.comexis.EmployeeController=DEBUG

# Set max connections for RestTemplate/WebClient
spring.web.client.connection-timeout=5000
spring.web.client.read-timeout=10000

# Reduce Tomcat thread load
server.tomcat.max-threads=200
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000

# Increase the max file size for a single file
spring.servlet.multipart.max-file-size=5MB

# Increase the total size allowed for the whole request (both files combined)
spring.servlet.multipart.max-request-size=5MB


opa.rest.url=http://localhost:8181/v1/data